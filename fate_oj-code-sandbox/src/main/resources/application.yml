server:
  port: 8090

sandbox:
  auth-header: auth
  auth-secret: fate
  work-dir: tmpCode
  default-time-limit: 3000
  default-memory-limit: 262144
  default-stack-limit: 65536
  compile-time-limit: 10000
  compile-memory-limit: 524288
  wall-time-extra: 1000
  max-output-bytes: 1048576
  max-processes: 32
  max-file-size: 65536
